#######################################
###### AI / LLM TRAINING CRAWLERS #####
#######################################
# Added 2026-09-10. meta-externalagent walked /code/ roughly 745,000 times in 4.5 days and was
# served HTTP 200 every time. It is what drove Gogs' commit-author avatar lookups, which grew
# gorm.log to 854MB — the crawler was the cause, the log was only the symptom.
#
# This is NOT facebookexternalhit. Meta splits the two: facebookexternalhit does link-preview
# unfurls for Facebook/Instagram/WhatsApp, meta-externalagent crawls for AI training. Only the
# latter is listed here, so previews are unaffected. Do not "tidy" this by merging them.
BrowserMatchNoCase "(?:\b)meta\-externalagent(?:\b)" bad_bot
# The !good_bot is LOAD-BEARING and must stay on the line below. globalblacklist.conf:39
# whitelists "developers.facebook.com" as good_bot, and this crawler puts exactly that
# URL in its own UA (+https://developers.facebook.com/docs/sharing/webmasters/crawler).
# The blocker ends in <RequireAny> with "Require env good_bot" (globalblacklist.conf:8212),
# so good_bot GRANTS access no matter what bad_bot says. Setting bad_bot alone is silently
# useless here — verified with httpd and a real request: 200, not 403.
BrowserMatchNoCase "(?:\b)meta\-externalagent(?:\b)" !good_bot

# Lightpanda is a headless browser library, not a fixed crawler, so this UA is whatever the
# operator happened to leave in place and is trivially changed. Listed because it accounted for
# ~27,000 served requests, not because the block is durable.
BrowserMatchNoCase "(?:\b)Lightpanda(?:\b)" bad_bot
