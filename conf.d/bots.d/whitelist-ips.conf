#######################################
######### LOCAL / RFC1918 LANs ########
#######################################
# For hosts that serve a LAN as well as the internet (cotton sits behind nginx on a
# private network). Without these, ddos.conf rate-limits local traffic — and behind NAT
# every machine on the LAN arrives as ONE address, so the whole house looks like a single
# very busy client and testing starts failing in ways that look like a broken site.
#
# Deliberately the generic RFC1918 ranges rather than a specific subnet: this repo is
# public, and a real subnet would be published with it. These never match on an
# internet-facing host anyway — private sources should not route there.
127.0.0.1 0;
::1 0;
10.0.0.0/8 0;
172.16.0.0/12 0;
192.168.0.0/16 0;


